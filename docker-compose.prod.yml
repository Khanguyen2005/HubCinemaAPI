# Production docker-compose file
version: '3.8'

services:
  hubcinema-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Override with external database and Redis if needed
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_PROD}
      - Redis__ConnectionString=${REDIS_CONNECTION_PROD}
    # Remove depends_on if using external services
    depends_on: []
