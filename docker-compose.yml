version: '3.8'

services:
  # ASP.NET Core API
  hubcinema-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hubcinema-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Database connection
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      # Redis connection
      - Redis__ConnectionString=${REDIS_CONNECTION}
      # JWT settings
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=HUBCinemaAPI
      - Jwt__Audience=myCinemaClient
      - Jwt__ExpiresInMinutes=60
      # Email settings
      - EmailSettings__SmtpServer=smtp.gmail.com
      - EmailSettings__Port=587
      - EmailSettings__SenderName=HubCinema
      - EmailSettings__SenderEmail=${EMAIL_USERNAME}
      - EmailSettings__Username=${EMAIL_USERNAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
      - EmailSettings__EnableSsl=true
    depends_on:
      - sqlserver
      - redis
    networks:
      - hubcinema-network
    restart: unless-stopped

  # SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hubcinema-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - hubcinema-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hubcinema-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hubcinema-network
    restart: unless-stopped

networks:
  hubcinema-network:
    driver: bridge

volumes:
  sqlserver-data:
  redis-data:
